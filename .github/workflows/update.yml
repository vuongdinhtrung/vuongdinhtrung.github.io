name: Auto-update publications and metrics

on:
  schedule:
    - cron: "0 1 */3 * *"   # every 3 days at 08:00 Hanoi time
  workflow_dispatch:         # "Run workflow" button for a manual update
  push:                      # rebuild right away when the page source is edited
    branches: [main]
    paths: ["_src/build.py", "_src/update.py"]

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch ORCID, Crossref and Google Scholar data
        run: python _src/update.py
      - name: Rebuild pages
        run: python _src/build.py .
      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Auto-update publications and metrics"
            git push
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == '1'
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
        env:
          GH_TOKEN: ${{ github.token }}
